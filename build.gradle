plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()
}

// Test harness mod: server game tests plus a client self test that screenshots a full strike.
sourceSets {
	gametest {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output + sourceSets.client.compileClasspath + sourceSets.client.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output + sourceSets.client.runtimeClasspath + sourceSets.client.output
	}
}

loom {
	mods {
		"shootingstar" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
		"shootingstar-gametest" {
			sourceSet sourceSets.gametest
		}
	}

	runs {
		gametest {
			server()
			name = "Game Test"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/gametest/junit.xml"
			runDir "build/gametest"
			source sourceSets.gametest
		}
		genworld {
			server()
			name = "Generate Self Test World"
			vmArg "-Dshootingstar.genworld=true"
			runDir "build/selftest-server"
			source sourceSets.gametest
		}
		selftest {
			client()
			name = "Client Self Test"
			vmArg "-Dshootingstar.selftest=true"
			runDir "build/selftest"
			source sourceSets.gametest
			programArgs "--quickPlaySingleplayer", "selftest", "--width", "1280", "--height", "720"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
