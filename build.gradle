plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

// This build makes every mod of the SMP's, each in its own jar: kortev's The Shooting Star here at the root, Chitty
// Chitty Bang Bang in chitty/, kortev's own powers in chainsawman/, and the friends' beside them (gojolander/). They are
// all set up the same way, against the same Minecraft and Fabric, here and for all of them at once, so that each one's
// source sets exist before the test harness below puts them together.
allprojects {
	apply plugin: 'fabric-loom'
	apply plugin: 'maven-publish'

	version = rootProject.mod_version
	group = rootProject.maven_group

	loom {
		splitEnvironmentSourceSets()
	}

	dependencies {
		minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
		mappings "net.fabricmc:yarn:${rootProject.yarn_mappings}:v2"
		modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
		modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"
	}

	processResources {
		inputs.property "version", rootProject.mod_version

		filesMatching("fabric.mod.json") {
			expand "version": rootProject.mod_version
		}
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 21
		it.options.encoding = "UTF-8"
	}

	java {
		sourceCompatibility = JavaVersion.VERSION_21
		targetCompatibility = JavaVersion.VERSION_21
	}
}

base {
	archivesName = project.archives_base_name
}

// Other players' mods run beside these in the dev game, to see how everything looks with them (Sodium, Iris and a
// shader pack, say): -PextraMods=path/to/one.jar;path/to/another.jar. Never part of a build or a jar.
if (project.hasProperty('extraMods')) {
	dependencies {
		project.property('extraMods').toString().split(';').findAll { it }.each { modLocalRuntime files(it) }
	}
}

def chittyProject = project(":chitty")
def gojolanderProject = project(":gojolander")
def chainsawProject = project(":chainsawman")

// Test harness mod: server game tests plus client self tests that film a full strike, a Ginnungagap or a drive in
// Chitty, and the game tests of the friends' mods. It loads every mod in the build together, as a server with all of
// them installed would.
sourceSets {
	gametest {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output + sourceSets.client.compileClasspath + sourceSets.client.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output + sourceSets.client.runtimeClasspath + sourceSets.client.output
		// Only Chitty's (and the friends' mods') own classes and resources: their classpaths have this project on it again.
		compileClasspath += chittyProject.sourceSets.main.output + chittyProject.sourceSets.client.output
		runtimeClasspath += chittyProject.sourceSets.main.output + chittyProject.sourceSets.client.output
		compileClasspath += gojolanderProject.sourceSets.main.output + gojolanderProject.sourceSets.client.output
		runtimeClasspath += gojolanderProject.sourceSets.main.output + gojolanderProject.sourceSets.client.output
		compileClasspath += chainsawProject.sourceSets.main.output + chainsawProject.sourceSets.client.output
		runtimeClasspath += chainsawProject.sourceSets.main.output + chainsawProject.sourceSets.client.output
	}
	// No code of its own: what the dev client and server run, every mod in the build together.
	allMods {
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output + sourceSets.client.runtimeClasspath + sourceSets.client.output
		runtimeClasspath += chittyProject.sourceSets.main.output + chittyProject.sourceSets.client.output
		runtimeClasspath += gojolanderProject.sourceSets.main.output + gojolanderProject.sourceSets.client.output
		runtimeClasspath += chainsawProject.sourceSets.main.output + chainsawProject.sourceSets.client.output
	}
}

loom {
	mods {
		"shootingstar" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
		"chitty" {
			sourceSet "main", chittyProject
			sourceSet "client", chittyProject
		}
		"gojolander" {
			sourceSet "main", gojolanderProject
			sourceSet "client", gojolanderProject
		}
		"chainsawman" {
			sourceSet "main", chainsawProject
			sourceSet "client", chainsawProject
		}
		"shootingstar-gametest" {
			sourceSet sourceSets.gametest
		}
	}

	runs {
		client {
			source sourceSets.allMods
			// The dev game plays offline, where nobody's skin can be fetched: it plays as kortev (or -Pusername) and
			// wears the players' own skins from run/skins/NAME.png (DevSkins).
			vmArg "-Dshootingstar.devskins"
			programArgs "--username", (project.findProperty('username') ?: 'kortev').toString()
		}
		server {
			source sourceSets.allMods
		}
		gametest {
			server()
			name = "Game Test"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/gametest/junit.xml"
			runDir "build/gametest"
			source sourceSets.gametest
		}
		genworld {
			server()
			name = "Generate Self Test World"
			vmArg "-Dshootingstar.genworld=true"
			runDir "build/selftest-server"
			source sourceSets.gametest
		}
		selftest {
			client()
			name = "Client Self Test"
			vmArg "-Dshootingstar.selftest=${project.findProperty('selftest') ?: 'gap'}"
			vmArg "-Dshootingstar.selftest.target=${project.findProperty('target') ?: ''}"
			// -Pcapture=true: the form self test's part also as a video (FormSelfTest).
			vmArg "-Dshootingstar.selftest.capture=${project.findProperty('capture') ?: ''}"
			runDir "build/selftest"
			source sourceSets.gametest
			// The window's size (-Pwidth, -Pheight: the film self tests are 1080x1920, for Shorts) and who plays (-Pusername).
			def window = ["--quickPlaySingleplayer", "selftest", "--width", (project.findProperty('width') ?: '1280').toString(),
					"--height", (project.findProperty('height') ?: '720').toString()]
			if (project.findProperty('username')) {
				window += ["--username", project.findProperty('username').toString()]
			}
			programArgs(window)
		}
		// The server going down without warning mid-event, and coming back (CrashTestServer, tools/crashtest.sh).
		crashserver {
			server()
			name = "Crash Test Server"
			vmArg "-Dshootingstar.crashtest=${project.findProperty('crashtest') ?: 'crash'}"
			runDir "build/crash/server"
			source sourceSets.gametest
		}
		// The multiplayer test: a dedicated server and three clients (MultiplayerTestServer, MultiplayerTestClient), playing
		// a Ginnungagap together, or with -Pscenario=domain the Domain (DomainMultiplayerServer, DomainMultiplayerClient).
		mpserver {
			server()
			name = "MP Test Server"
			vmArg "-Xmx3G"
			vmArg "-Dshootingstar.mptest=server"
			vmArg "-Dshootingstar.mptest.scenario=${project.findProperty('scenario') ?: 'gap'}"
			runDir "build/mp/server"
			source sourceSets.gametest
		}
		["Shooter", "Victim", "Netherling"].each { who ->
			create("mp" + who.toLowerCase()) {
				client()
				name = "MP Test " + who
				vmArg "-Xmx2G"
				vmArg "-Dshootingstar.selftest=mp-" + who.toLowerCase()
				vmArg "-Dshootingstar.mptest.scenario=${project.findProperty('scenario') ?: 'gap'}"
				runDir "build/mp/" + who.toLowerCase()
				source sourceSets.gametest
				programArgs "--quickPlayMultiplayer", "localhost:25565", "--username", who, "--width", "854", "--height", "480"
			}
		}
	}
}

// The dev game and the form self test wear kortev's skin, the Public Safety one from tools/skins, unless a skin is
// already there: run/skins/kortev.png for the dev game (DevSkins), build/selftest/skins/Kortev.png for the stand-in.
tasks.register('seedSkins') {
	def skin = file('tools/skins/kortev_public_safety.png')
	def targets = [file('run/skins/kortev.png'), file('build/selftest/skins/Kortev.png')]
	doLast {
		targets.each { target ->
			if (!target.exists()) {
				target.parentFile.mkdirs()
				java.nio.file.Files.copy(skin.toPath(), target.toPath())
			}
		}
	}
}
tasks.matching { it.name in ['runClient', 'runSelftest'] }.configureEach { dependsOn 'seedSkins' }

// The first reel's cast (tools/reel_skins.py), and Denji in kortev's own onesie, for the reel's self test (ReelSelfTest).
tasks.register('seedReelSkins', Copy) {
	from('tools/skins/reel')
	from('tools/skins/kortev_onesie.png') { rename { 'Denji.png' } }
	into('build/selftest/skins')
}
tasks.matching { it.name == 'runSelftest' }.configureEach { dependsOn 'seedReelSkins' }

// The self tests' world, made once the way CI makes it (runGenworld's server, its world copied into the client's saves),
// and the client's options, so ./gradlew runSelftest quick-plays straight into it on a PC too.
tasks.register('selftestServerSetup') {
	doLast {
		def dir = file('build/selftest-server')
		dir.mkdirs()
		new File(dir, 'eula.txt').text = 'eula=true\n'
		def props = new File(dir, 'server.properties')
		if (!props.exists()) {
			props.text = 'level-name=selftest\nlevel-seed=shootingstar\nonline-mode=false\nspawn-protection=0\n'
		}
	}
}
tasks.matching { it.name == 'runGenworld' }.configureEach {
	dependsOn 'selftestServerSetup'
	onlyIf { !file('build/selftest/saves/selftest').exists() }
}
tasks.register('selftestWorld') {
	dependsOn 'runGenworld'
	doLast {
		def world = file('build/selftest/saves/selftest')
		if (!world.exists()) {
			project.copy {
				from 'build/selftest-server/selftest'
				into world
			}
		}
		def options = file('build/selftest/options.txt')
		if (!options.exists()) {
			project.copy {
				from '.github/selftest/options.txt'
				into 'build/selftest'
			}
		}
	}
}
tasks.matching { it.name == 'runSelftest' }.configureEach { dependsOn 'selftestWorld' }
