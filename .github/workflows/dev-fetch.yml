name: dev-fetch

# Development-only: downloads public-domain NASA maps into the log. Removed before merging.
on:
  push:
    branches: ['claude/**']
    paths: ['.github/dev/fetch.py', '.github/workflows/dev-fetch.yml']

jobs:
  fetch:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        asset: [jupiter, stars_exr]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pillow numpy opencv-python-headless
      - run: python3 .github/dev/fetch.py ${{ matrix.asset }}
