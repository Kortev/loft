name: dev-probe

on:
  push:
    branches: ['claude/**']
    paths: ['.github/scripts/**', '.github/workflows/dev-probe.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Discover versions
        run: bash .github/scripts/discover-versions.sh
      - name: Build
        continue-on-error: true
        run: ./gradlew build --stacktrace
      - name: Dump API signatures
        if: always()
        run: bash .github/scripts/dump-api.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-output
          path: ci-out/
