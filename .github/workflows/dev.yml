name: dev

# Development-only helpers: decompiled-source probe and NASA texture fetch. Removed before merging.
on:
  push:
    branches: ['claude/**']
    paths: ['.github/dev/**', '.github/workflows/dev.yml']

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Decompile
        run: ./gradlew genSources --stacktrace -q
      - name: Print sources
        run: python3 .github/dev/probe.py

  fetch:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        asset: [earth_day, earth_clouds, earth_night, jupiter, stars]
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get install -y -q python3-pil
      - run: python3 .github/dev/fetch.py ${{ matrix.asset }}
