// Chitty Chitty Bang Bang, a mod of her own in her own jar. Loom, Minecraft, Fabric and Java are set up for every mod
// in the root build.gradle, which also has the test harness and the dev runs that load her beside The Shooting Star.

base {
	archivesName = 'chitty-chitty-bang-bang'
}

dependencies {
	// She needs The Shooting Star: her things share its namespace, its owner-only crafting and its advancement trigger.
	implementation project(path: ':', configuration: 'namedElements')
}

// She is run from the root project beside The Shooting Star (its runClient, runServer and runGametest load every mod),
// so `./gradlew runClient` starts one game, not a second one from here.
loom.runConfigs.clear()
