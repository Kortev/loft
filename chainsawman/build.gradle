// Chainsaw Man: a public mod that needs only Fabric API. Loom, Minecraft, Fabric and Java are set up for every mod in
// the root build.gradle, which also has the test harness and the dev runs that load it (the harness depends on this
// mod, never the other way round).

base {
	archivesName = 'chainsawman'
}

// It is run from the root project beside every other mod, so `./gradlew runClient` starts one game, not a second one.
loom.runConfigs.clear()
